name: Auralis CI/CD

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auralis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: development
      JWT_SECRET: ci-only-secret-not-used-in-any-environment
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: python -m pip install -r requirements.txt -r requirements.lock.txt
      - run: python -m pip check
      - run: python -m pytest --junitxml=test-results.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-test-results
          path: backend/test-results.xml
          retention-days: 14

  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_BASE_URL: /api
      NEXT_PUBLIC_DEV_AUTH_BYPASS: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            widget/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: |
          cp -a public .next/standalone/public
          cp -a .next/static .next/standalone/.next/static
          HOSTNAME=127.0.0.1 PORT=3100 node .next/standalone/server.js &
          server=$!
          trap 'kill "$server"' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3100/login -o /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3100/login -o /dev/null
        working-directory: web
      - run: npm ci --no-audit --no-fund
        working-directory: widget
      - run: |
          npm test
          npm run build
          node --check dist/chatbot.js
          node --check dist/chatbot.min.js
        working-directory: widget
      - run: |
          for script in deploy/*.sh; do bash -n "$script"; done
          bash deploy/test_deploy.sh
          printf '%s\n' "$GITHUB_SHA" > COMMIT
          tar --exclude='web/.next/standalone/.next/cache' -czf release.tgz COMMIT backend/app backend/requirements.txt backend/requirements.lock.txt web/.next/standalone widget/dist deploy
          sha256sum release.tgz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: auralis-release
          path: |
            release.tgz
            SHA256SUMS
          retention-days: 14
          if-no-files-found: error

  deploy:
    needs: [backend, release]
    if: github.ref == 'refs/heads/staging' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: staging
      url: https://auralisai.duckdns.org
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-1
      EC2_INSTANCE_ID: i-0a87fb704efaa0ed2
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      SSM_DOCUMENT: AuralisDeploy
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: auralis-release
      - run: sha256sum -c SHA256SUMS
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Upload and deploy the tested artifact through SSM
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_BUCKET" =~ ^[a-z0-9][a-z0-9.-]+[a-z0-9]$ ]]
          online=$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$EC2_INSTANCE_ID" --query 'InstanceInformationList[0].PingStatus' --output text)
          [[ "$online" == Online ]] || { echo 'EC2 is not Online in Systems Manager; check its instance profile.' >&2; exit 1; }
          release_id="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          key="auralis/$release_id/release.tgz"
          aws s3 cp release.tgz "s3://$ARTIFACT_BUCKET/$key" --only-show-errors
          digest=$(sha256sum release.tgz | cut -d ' ' -f 1)
          jq -n --arg url "https://$ARTIFACT_BUCKET.s3.$AWS_REGION.amazonaws.com/$key" --arg sha "$GITHUB_SHA" --arg id "$release_id" --arg digest "$digest" \
            '{ArtifactUrl:[$url],Commit:[$sha],ReleaseId:[$id],ArtifactSha256:[$digest]}' > parameters.json
          command_id=$(aws ssm send-command --instance-ids "$EC2_INSTANCE_ID" --document-name "$SSM_DOCUMENT" --parameters file://parameters.json --timeout-seconds 120 --comment "Auralis $release_id" --query 'Command.CommandId' --output text)
          echo "SSM command: $command_id; commit: $GITHUB_SHA"
          deadline=$((SECONDS + 3000))
          while (( SECONDS < deadline )); do
            status=$(aws ssm list-command-invocations --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" --query 'CommandInvocations[0].Status' --output text)
            case "$status" in
              Success) echo "Deployed $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"; exit 0 ;;
              Failed|Cancelled|TimedOut)
                aws ssm list-command-invocations --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" --details --query 'CommandInvocations[0].CommandPlugins[].{Name:Name,Status:Status,Output:Output}' --output json
                exit 1 ;;
            esac
            sleep 15
          done
          echo "SSM observation timed out; command $command_id may still be running. Check Systems Manager before retrying." >&2
          exit 1
